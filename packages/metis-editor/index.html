<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Metis</title>
    <!--
      The app renders into an empty root, so without these a crawler, a link
      preview or a reputation scanner sees a page with no words on it at all:
      a sign-in box and nothing else. On a young domain that reads as a
      credential-harvesting shell, which is roughly what happened.
    -->
    <meta
      name="description"
      content="Metis is an open source workflow engine, durable by Temporal and licensed Apache-2.0. This is the sign-in for a Metis instance."
    />
    <meta name="application-name" content="Metis" />
    <meta property="og:site_name" content="Metis" />
    <meta property="og:title" content="Metis" />
    <meta
      property="og:description"
      content="The open workflow engine, durable by Temporal, Apache-2.0. Source at github.com/mindlynx-ai/metis."
    />
    <meta property="og:type" content="website" />
    <script>
      // Follow the machine, then remember the person. A first-time visitor gets
      // whatever their OS already asked for, because arriving in dark mode on a
      // light desktop reads as a site that ignores you. A stored choice still
      // wins over both - once you have picked, that IS your preference.
      // Inline and pre-paint on purpose: a theme applied after first paint is a
      // white flash on a dark machine.
      var stored = null;
      try {
        stored = localStorage.getItem('metis-theme');
      } catch (error) {
        // Private mode and blocked site-data both throw on read. A theme is not
        // worth a blank page, so fall through to the system preference.
      }
      document.documentElement.dataset.theme =
        stored ||
        (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
          ? 'light'
          : 'dark');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
